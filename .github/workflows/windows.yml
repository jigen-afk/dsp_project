name: Windows build and release

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test the standalone Windows EXE
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
    outputs:
      sha256: ${{ steps.self_test.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: source
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          architecture: x64
      - name: Run tests and build DSPStudio.exe
        shell: pwsh
        run: ./source/build.ps1
      - name: Test the EXE by itself
        id: self_test
        shell: pwsh
        run: |
          $isolated = Join-Path $env:RUNNER_TEMP 'dspstudio-standalone'
          New-Item -ItemType Directory -Path $isolated | Out-Null
          $exe = Join-Path $isolated 'DSPStudio.exe'
          Copy-Item -LiteralPath 'source/dist/DSPStudio.exe' -Destination $exe
          $report = Join-Path $isolated 'self-check.json'
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $process = Start-Process -FilePath $exe `
            -WorkingDirectory $isolated -ArgumentList "--self-test --report `"$report`"" `
            -WindowStyle Hidden -Wait -PassThru
          if (!(Test-Path -LiteralPath $report)) {
            throw "The packaged EXE did not produce a self-test report (exit $($process.ExitCode))."
          }
          Get-Content -LiteralPath $report
          if ($process.ExitCode -ne 0 -or (Get-Content -LiteralPath $report -Raw | ConvertFrom-Json).passed -ne $true) {
            throw 'The packaged EXE failed its self-test.'
          }

          $sha = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "sha256=$sha" -Encoding utf8
      - name: Upload DSPStudio.exe
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: source/dist/DSPStudio.exe
          archive: false
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  release:
    name: Publish Windows Release
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: windows-release
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: DSPStudio.exe
      - name: Verify the EXE checksum
        env:
          EXPECTED_SHA: ${{ needs.build.outputs.sha256 }}
        run: printf '%s  DSPStudio.exe\n' "$EXPECTED_SHA" | sha256sum --check -
      - name: Publish the checked build as Latest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          head_ref="repos/$GH_REPO/git/ref/heads/$GITHUB_REF_NAME"
          head_sha=$(gh api "$head_ref" --jq .object.sha)
          if [[ "$head_sha" != "$GITHUB_SHA" ]]; then
            echo 'A newer commit is already on the release branch. Skipping this build.'
            exit 0
          fi

          tag="windows-$GITHUB_SHA"
          draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null || true)
          if [[ "$draft" == false ]]; then
            gh release edit "$tag" --latest
            exit 0
          fi
          if [[ "$draft" != true ]]; then
            notes=$(cat <<EOF
          下载 DSPStudio.exe 后双击运行。支持 64 位 Windows 10/11，无需安装 Python 或解压文件。

          [源码提交]($GITHUB_SERVER_URL/$GH_REPO/commit/$GITHUB_SHA) · [构建与自检]($GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID)
          EOF
            )
            gh release create "$tag" --draft --target "$GITHUB_SHA" \
              --title "DSP Studio Windows (${GITHUB_SHA:0:12})" --notes "$notes"
          fi
          gh release upload "$tag" DSPStudio.exe --clobber

          head_sha=$(gh api "$head_ref" --jq .object.sha)
          if [[ "$head_sha" != "$GITHUB_SHA" ]]; then
            echo 'A newer commit arrived during upload. Leaving this build as a draft.'
            exit 0
          fi
          gh release edit "$tag" --draft=false --latest
