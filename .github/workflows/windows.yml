name: Windows build and release

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test Windows package
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: source
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          architecture: x64
      - name: Run tests and build DSPStudio.exe
        shell: pwsh
        run: ./source/build.ps1
      - name: Test the packaged EXE and create the ZIP
        shell: pwsh
        run: |
          $package = Join-Path $PWD 'source/dist/DSPStudio'
          $report = Join-Path $env:RUNNER_TEMP 'dspstudio-self-check.json'
          $process = Start-Process -FilePath (Join-Path $package 'DSPStudio.exe') `
            -WorkingDirectory $package -ArgumentList "--self-test --report `"$report`"" `
            -WindowStyle Hidden -Wait -PassThru
          if (!(Test-Path -LiteralPath $report)) {
            throw "The packaged EXE did not produce a self-test report (exit $($process.ExitCode))."
          }
          Get-Content -LiteralPath $report
          if ($process.ExitCode -ne 0 -or (Get-Content -LiteralPath $report -Raw | ConvertFrom-Json).passed -ne $true) {
            throw 'The packaged EXE failed its self-test.'
          }

          $archive = 'DSPStudio-Windows-x64.zip'
          $level = [System.IO.Compression.CompressionLevel]::Optimal
          [System.IO.Compression.ZipFile]::CreateFromDirectory($package, (Join-Path $PWD $archive), $level, $true)
          $sha = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText((Join-Path $PWD "$archive.sha256"), "$sha  $archive`n")
      - name: Upload the Windows package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: DSPStudio-Windows-x64
          path: |
            DSPStudio-Windows-x64.zip
            DSPStudio-Windows-x64.zip.sha256
          if-no-files-found: error
          overwrite: true
          compression-level: 0
          retention-days: 14

  release:
    name: Publish Windows Release
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: windows-release
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: DSPStudio-Windows-x64
      - name: Verify the ZIP checksum
        run: sha256sum --check DSPStudio-Windows-x64.zip.sha256
      - name: Publish the checked build as Latest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          head_ref="repos/$GH_REPO/git/ref/heads/$GITHUB_REF_NAME"
          head_sha=$(gh api "$head_ref" --jq .object.sha)
          if [[ "$head_sha" != "$GITHUB_SHA" ]]; then
            echo 'A newer commit is already on the release branch. Skipping this build.'
            exit 0
          fi

          tag="windows-$GITHUB_SHA"
          draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null || true)
          if [[ "$draft" == false ]]; then
            gh release edit "$tag" --latest
            exit 0
          fi
          if [[ "$draft" != true ]]; then
            notes=$(cat <<EOF
          下载并完整解压 DSPStudio-Windows-x64.zip，然后运行 DSPStudio/DSPStudio.exe。请保留同目录的 _internal。

          [源码提交]($GITHUB_SERVER_URL/$GH_REPO/commit/$GITHUB_SHA) · [构建与自检]($GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID)
          EOF
            )
            gh release create "$tag" --draft --target "$GITHUB_SHA" \
              --title "DSP Studio Windows (${GITHUB_SHA:0:12})" --notes "$notes"
          fi
          gh release upload "$tag" DSPStudio-Windows-x64.zip DSPStudio-Windows-x64.zip.sha256 --clobber

          head_sha=$(gh api "$head_ref" --jq .object.sha)
          if [[ "$head_sha" != "$GITHUB_SHA" ]]; then
            echo 'A newer commit arrived during upload. Leaving this build as a draft.'
            exit 0
          fi
          gh release edit "$tag" --draft=false --latest
